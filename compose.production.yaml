services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/dh-555/spam-guard-bot:latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # The named volume replaces the cache directory created in the image.
    # Recreate it on every start so existing/empty volumes work as well.
    command: ["sh", "-c", "mkdir -p /home/node/.cache/ppu-paddle-ocr && exec node src/index.js"]
    volumes:
      - bot-data:/app/data
      - ocr-cache:/home/node/.cache/ppu-paddle-ocr
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot-data:
  ocr-cache:
